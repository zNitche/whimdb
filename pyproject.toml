[build-system]
requires = ["setuptools==70.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["examples*", "tests*"]

[project]
name = "whimdb"
version = "1.2.2"
authors = [
  { name = "zNitche" },
]
description = "micro key-value in-memory database"
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"

[project.scripts]
whimdb-server = "whimdb.cli.whimdb_server:run"

[project.urls]
Homepage = "https://github.com/zNitche/whimdb"
Issues = "https://github.com/zNitche/whimdb/issues"
